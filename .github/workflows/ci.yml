# Runs on every push and pull request. Everything here is offline: tests and evals use recorded
# model responses (AI_MODE=REPLAY), so CI needs no API keys and makes no billed calls.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: Web and shared (typecheck, lint, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # An empty VITE_API_URL keeps the web tests on their own mocks even if a .env exists.
      - run: pnpm test
        env:
          VITE_API_URL: ""

  python:
    name: Python ${{ matrix.project }} (ruff, pyright, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [agents, payops]
    defaults:
      run:
        working-directory: python/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: python/${{ matrix.project }}/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest -q
      # The 15 golden scenarios through the real API process, replaying recorded model responses.
      - run: uv run python -m payops.evals
        if: matrix.project == 'payops'

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reports known vulnerabilities without blocking merges on advisories nobody can fix yet.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm audit --prod --audit-level high
      - uses: astral-sh/setup-uv@v5
      - run: uvx pip-audit --requirement <(uv export --frozen --no-dev --no-hashes --project python/agents) --no-deps --disable-pip
        shell: bash
      - run: uvx pip-audit --requirement <(uv export --frozen --no-dev --no-hashes --project python/payops) --no-deps --disable-pip
        shell: bash
