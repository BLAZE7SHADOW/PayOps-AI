# Render blueprint for the free API host: one Python service (FastAPI, job worker, Socket.IO and the agents in one process).
# The database is Supabase (free) and the web app is on Vercel. Free web services sleep after 15 minutes idle,
# so the first request takes about 50 seconds to wake.
services:
  - type: web
    name: payops-backend
    runtime: python
    plan: free
    # The project lives in python/payops and installs the agent package from ../agents, so build from the repo root.
    buildCommand: pip install uv && cd python/payops && uv sync --frozen --no-dev
    # Migrations and demo users are applied on start (MIGRATE_ON_START defaults to on).
    startCommand: cd python/payops && uv run --no-dev uvicorn payops.api.app:app_factory --factory --host 0.0.0.0 --port $PORT --timeout-graceful-shutdown 30
    healthCheckPath: /api/health
    # Redeploy only when the backend changes. A web-only commit (Vercel builds that) must not restart this service.
    buildFilter:
      paths:
        - python/**
        - render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: NODE_ENV
        value: production
      - key: AI_MODE
        value: REPLAY          # recorded responses only: no Gemini or Jev keys needed
      - key: DEMO_MODE
        value: true
      # Bandwidth (D083): the free plan includes 5 GB of outbound traffic a month and database round trips count.
      # No minute-by-minute sweep on the hosted demo; the queue waits on LISTEN/NOTIFY and polls rarely.
      - key: RECONCILE_SWEEP_MS
        value: 0
      - key: JOB_POLL_SECONDS
        value: 30
      # Connection budget: the Supabase Session pooler allows 15 clients in total, and a deploy briefly runs the old and the
      # new process together. One process holds at most 3 + 2 + 2 + 2 = 9 and usually about half of that (pools open lazily).
      - key: DATABASE_POOL_MAX
        value: 3
      - key: GATEWAY_POOL_MAX
        value: 2
      - key: CHECKPOINT_POOL_MAX
        value: 2
      - key: JOB_POOL_MAX
        value: 2
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false            # Supabase: Project Settings > Database > Session pooler (port 5432). Letters and digits in the password.
      - key: WEB_ORIGIN
        sync: false            # your Vercel URL, e.g. https://payops-ai.vercel.app
