[project]
name = "payops-agents"
version = "0.1.0"
description = "PayOps AI agents: the LangGraph investigation graph, run in process by the backend (D085, D090)."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "httpx>=0.27",
  "langgraph>=0.2",
  "langchain-google-genai>=2.0",
  "langgraph-checkpoint-postgres>=2.0",
  "psycopg[binary,pool]>=3.2",
  "pydantic-settings>=2.16.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "pyright>=1.1.390"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payops_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# E501 is off on purpose: `ruff format` wraps code at 120 columns, and the only lines left over are long message strings,
# which cannot be split without changing readability. Comments and docstrings are wrapped to 120. Prompt text is hashed into REPLAY keys, so it is never re-wrapped.
ignore = ["E501", "UP046", "UP047"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
reportMissingTypeStubs = false
pythonVersion = "3.12"


# Tests build small partial fixtures (a dict with only the keys a function reads), so argument-shape checks are off there.
[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["src", "."]
reportArgumentType = false
reportTypedDictNotRequiredAccess = false

[[tool.pyright.executionEnvironments]]
root = "."
