[project]
name = "payops-agents"
version = "0.1.0"
description = "PayOps AI agents: the LangGraph investigation graph, run in process by the backend (D085, D090)."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "httpx>=0.27",
  "langgraph>=0.2",
  "langchain-google-genai>=2.0",
  "langgraph-checkpoint-postgres>=2.0",
  "psycopg[binary,pool]>=3.2",
  "pydantic-settings>=2.16.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "pyright>=1.1.390"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payops_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP046", "UP047"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
reportMissingTypeStubs = false
pythonVersion = "3.12"

[tool.ruff.lint.per-file-ignores]
# Prompt text is hashed into REPLAY keys, so it can't be re-wrapped to fit a line length.
"src/payops_agents/tools_catalog.py" = ["E501"]
"src/payops_agents/narratives.py" = ["E501"]
"src/payops_agents/grounding.py" = ["E501"]
"src/payops_agents/risk.py" = ["E501"]
"src/payops_agents/context.py" = ["E501"]
"src/payops_agents/nodes/*.py" = ["E501"]
"tests/*" = ["E501"]
