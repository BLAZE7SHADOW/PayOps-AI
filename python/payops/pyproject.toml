[project]
name = "payops"
version = "0.1.0"
description = "PayOps AI backend (FastAPI), replacing the TypeScript API and core (D086)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary,pool]>=3.2",
  "procrastinate>=3.10.0",
  "python-socketio>=5.17.0",
  "pyjwt>=2.15.1",
  "cryptography>=50.0.2",
  "payops-agents",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pgserver>=0.1.4",
    "httpx>=0.28.1",
    "sqlacodegen>=4.0.4",
    "aiohttp>=3.14.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore:Setting per-request cookies:DeprecationWarning"]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# E501 is off on purpose: `ruff format` wraps code at 120 columns, and the only lines left over are long message strings,
# which cannot be split without changing readability. Comments and docstrings are wrapped to 120. Prompt text is hashed into REPLAY keys, so it is never re-wrapped.
ignore = ["E501", "UP046", "UP047"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
reportMissingTypeStubs = false
pythonVersion = "3.12"

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["I001"]

[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["src", "."]
reportOptionalMemberAccess = false
reportOptionalOperand = false
reportOptionalSubscript = false
reportArgumentType = false
reportCallIssue = false
reportIndexIssue = false
reportAttributeAccessIssue = false

[tool.uv.sources]
payops-agents = { path = "../agents", editable = true }
