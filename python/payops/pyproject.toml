[project]
name = "payops"
version = "0.1.0"
description = "PayOps AI backend (FastAPI), replacing the TypeScript API and core (D086)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary,pool]>=3.2",
  "procrastinate>=3.10.0",
  "python-socketio>=5.17.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pgserver>=0.1.4",
    "httpx>=0.28.1",
    "sqlacodegen>=4.0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP046", "UP047"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
reportMissingTypeStubs = false
pythonVersion = "3.12"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"migrations/*" = ["I001"]
"src/payops/db/models.py" = ["E501"]
"src/payops/domain/**/*.py" = ["E501"]
"src/payops/infra/*.py" = ["E501"]
"src/payops/services/*.py" = ["E501"]
"src/payops/api/*.py" = ["E501"]
"src/payops/dto/*.py" = ["E501"]

[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["src", "."]
reportOptionalMemberAccess = false
reportOptionalOperand = false
reportOptionalSubscript = false
reportArgumentType = false
reportCallIssue = false
reportIndexIssue = false
reportAttributeAccessIssue = false
